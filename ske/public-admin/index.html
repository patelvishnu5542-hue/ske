<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Login | Shree Krishna Enterprises</title>
    <meta name="theme-color" content="#34b7f1">

    <link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="css/admin.css?v=9b33d1f2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" src="js/auth.js?v=1555689b"></script>
    <script type="module" src="js/pwa.js?v=f11a10ba"></script>
</head>
<body>
    <main class="login-container">
        <div class="login-box">
            <h1 class="login-title">Admin Area</h1>
            <form id="login-form">
                <div class="form-group" style="text-align: left;">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="username" required>
                </div>
                <div class="form-group" style="text-align: left;">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <p id="error-msg" role="alert" style="font-size: 0.875rem;" hidden></p>
                <button type="submit" class="btn btn-primary" id="login-btn">Login</button>
            </form>
            <div style="margin-top: 1rem; display: flex; justify-content: space-between; gap: 1rem;">
                <button type="button" id="forgot-btn" class="link-btn">Forgot password?</button>
                <a href="https://shreekrishnaenterprises.shop/" style="color: var(--text-muted); font-size: 0.875rem; text-decoration: none;">&larr; Back to website</a>
            </div>
        </div>
    </main>
</body>
</html>
